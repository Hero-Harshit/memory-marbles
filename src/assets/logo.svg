<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Base Gradient for the Marble -->
    <radialGradient id="marbleGradient" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="25%" stop-color="#e879f9"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    
    <!-- Core Glow (Inner light) -->
    <radialGradient id="coreGlow" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
    
    <!-- Top Highlight (Glass reflection) -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>

    <!-- Bottom Shadow (Depth) -->
    <radialGradient id="bottomShadow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>

  <!-- Perfectly round base circle (no choppy edges) -->
  <circle cx="256" cy="256" r="240" fill="url(#marbleGradient)" />
  
  <!-- Bottom Shadow for 3D effect -->
  <circle cx="256" cy="256" r="240" fill="url(#bottomShadow)" />

  <!-- Core Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#coreGlow)" />

  <!-- Top Glass Highlight (Curved) -->
  <path d="M 120 140 A 160 100 0 0 1 392 140 A 180 120 0 0 0 120 140" fill="url(#topHighlight)" />
  
  <!-- Small secondary highlight -->
  <circle cx="170" cy="160" r="30" fill="rgba(255,255,255,0.6)" filter="blur(4px)" />
</svg>