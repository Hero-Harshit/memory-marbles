<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Map</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <button onclick="window.location.href='museum.html'">My Museum</button>
        <button onclick="window.location.href='index.html'">Create A Memory Marble</button>
    </nav>

    <h1>Settings</h1>

    <div class="settings-container">

        <div class="settings-card">
            <p> Deletes all memories from the museum. This action cannot be undone. </p>
            <div>
                <button id="clear-museum-button" class="clear-museum-button"> Marble Massacre </button>
            </div>
        </div>
        <hr>
        <div class="settings-card">
            <p> Download all your precious memories as a Json file.</p>
            <button id="export-button" class="export-button">Export Memories</button>
        </div>
        <hr>
        <div class="settings-card">
            <p>Import memories from a previously exported file.</p>
            <input type="file" id="import-input" accept=".json" style="display:none">
            <button id="import-button">Import Memories</button>
        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
