<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="homepage">

    <div id="notification-panel" class="notification-panel">
        <p id="notification-text"> </p>
    </div>

    <nav class="navigation-bar">

        <button id="hamburger-btn" class="hamburger-btn"> ☰ </button>
        
        <div class="navigation-menu" id="navigation-menu">

            <div class="navigation-menu-top-container">
                <h3>Navigation Menu</h3>
                <button id="navigation-menu-close-btn" class="close-btn"> X </button>
            </div>

            <div class="navigation-menu-button-container">
                <button onclick="window.location.href='index.html'"> Create Memory </button>
                <button onclick="window.location.href='museum.html'"> My Museum </button>
                <button onclick="window.location.href='settings.html'"> Settings </button>
                <button onclick="window.location.href='about.html'"> About Us</button>
            </div>

        </div>
        
        <button class="profile-btn" id="profile-btn"> 👤 </button>

        <div class="profile-menu" id="profile-menu">

            <div>

                <img/>
                <h3>Your Name</h3>
                
            </div>
            
            <div>
                <h3> Your Stats :- </h3>
            </div>

        </div>
    </nav>

    <div class="top-container"> 

        <h1>Create A Memory Marble</h1>
        <h3>Your created memory will be displayed at our museum.</h3>

    </div>

    <div class="memory-input-container">

        <div id="memory-emotion" class="all-emotions-container">
            
            <h3>How are you feeling?</h3>

            <div class="emotions-container">

                <button class="emotion-button" data-emotion="joy">
                    <img class="emotion-image" src="assests/Joy.png" />
                </button>

                <button class="emotion-button" data-emotion="sadness">
                    <img class="emotion-image" src="assests/Sadness.png" />
                </button>

                <button class="emotion-button" data-emotion="anger">
                    <img class="emotion-image" src="assests/Anger.png" />
                </button>

                <button class="emotion-button" data-emotion="fear">
                    <img class="emotion-image" src="assests/Fear.png" />
                </button>

                <button class="emotion-button" data-emotion="disgust">
                    <img class="emotion-image" src="assests/Disgust.png" />
                </button>

            </div>

        </div>

        <textarea rows="10" id="memory-description" class="memory-description-textarea" placeholder="Describe your memory"></textarea>
        
        <p id="add-memory-error-msg" class="error-msg"> </p>

        <div>
            <button class="add-memory-button" id="add-memory-button">Add Memory</button>
        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
